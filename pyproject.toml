[project]
name = "developer-doctor"
version = "0.1.0"
description = "A plugin-driven CLI that diagnoses developer workstations and produces a concise, actionable health report."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gautham Krishna N", email = "gkn240801@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["cli", "diagnostics", "developer-tools", "devops", "health-check"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "gitpython>=3.1.50",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
doctor = "doctor.cli:app"

[project.urls]
Homepage = "https://github.com/Gautham248/developer-doctor"
Repository = "https://github.com/Gautham248/developer-doctor"
Issues = "https://github.com/Gautham248/developer-doctor/issues"

[build-system]

requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doctor"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260518",
]
